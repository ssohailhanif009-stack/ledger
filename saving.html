<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Financial Management System</title>
    <!-- Tailwind CSS for clean layout, customized for small professional fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-size: 13px;
        }
        /* Official Navy Blue / MS Word style simple table */
        table.ms-word-table {
            border-collapse: collapse;
            width: 100%;
        }
        table.ms-word-table th, table.ms-word-table td {
            border: 1px solid #1e3a8a;
            padding: 8px 10px;
            text-align: left;
        }
        table.ms-word-table th {
            background-color: #1e3a8a;
            color: white;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-white text-gray-900 p-4 md:p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Main Heading with Navy Blue Shade -->
        <h1 class="text-center text-xl font-bold uppercase tracking-wide mb-6 bg-blue-900 text-white py-3 px-4 rounded shadow">
            Comprehensive Personal Financial Saving & Expense Management System
        </h1>

        <!-- Top Controls: Separate Month & Year Filters & Actions -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4 bg-blue-50 p-3 border border-blue-900 rounded">
            <div class="flex flex-wrap items-center gap-3">
                <!-- Month Filter -->
                <div class="flex items-center gap-1">
                    <label for="monthFilter" class="font-bold text-xs uppercase text-blue-900">Month:</label>
                    <select id="monthFilter" class="border border-blue-900 px-2 py-1 text-xs bg-white rounded" onchange="filterData()">
                        <option value="ALL">All Months</option>
                        <option value="01">January</option>
                        <option value="02">February</option>
                        <option value="03">March</option>
                        <option value="04">April</option>
                        <option value="05">May</option>
                        <option value="06">June</option>
                        <option value="07">July</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>

                <!-- Year Filter -->
                <div class="flex items-center gap-1">
                    <label for="yearFilter" class="font-bold text-xs uppercase text-blue-900">Year:</label>
                    <select id="yearFilter" class="border border-blue-900 px-2 py-1 text-xs bg-white rounded" onchange="filterData()">
                        <option value="ALL">All Years</option>
                    </select>
                </div>
            </div>

            <div>
                <button onclick="addNewRowToFirebase()" class="bg-blue-900 text-white px-4 py-1 text-xs uppercase font-semibold rounded hover:bg-blue-800">
                    Create New Row
                </button>
            </div>
        </div>

        <!-- Line List Table with horizontal scroll support for mobile -->
        <div class="overflow-x-auto shadow-sm rounded border border-blue-900">
            <table class="ms-word-table" id="savingTable">
                <thead>
                    <tr>
                        <th style="min-width: 180px;">Date and Time</th>
                        <th style="min-width: 140px;">Amount Type</th>
                        <th style="min-width: 120px;">Amount Received</th>
                        <th style="min-width: 120px;">Used</th>
                        <th style="min-width: 100px;">Balance</th>
                        <th style="min-width: 180px;">Remarks</th>
                        <th class="text-center" style="min-width: 80px;">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK Integration & Firestore setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNDifUQOSYt_nQSeL_ZIxXhfNzTGQJGdA",
            authDomain: "ledger-df7a0.firebaseapp.com",
            projectId: "ledger-df7a0",
            storageBucket: "ledger-df7a0.firebasestorage.app",
            messagingSenderId: "854106995075",
            appId: "1:854106995075:web:198b3702c4214197929eb6",
            measurementId: "G-9C0C5XSD5K"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.updateDoc = updateDoc;
        window.deleteDoc = deleteDoc;
        window.doc = doc;

        // Page load hone par Firebase se data fetch karna
        window.addEventListener('DOMContentLoaded', () => {
            fetchDataFromFirebase();
        });
    </script>

    <script>
        let applicationData = [];

        function populateYearFilterOptions() {
            const yearSelect = document.getElementById('yearFilter');
            const currentSelectedYear = yearSelect.value;
            
            // Sirf wohi saal extract karna jo applicationData mein maujood hain
            let yearsSet = new Set();
            applicationData.forEach(item => {
                if (item.dateTime) {
                    let datePart = item.dateTime.split(' ')[0];
                    if (datePart.includes('-')) {
                        let parts = datePart.split('-');
                        if (parts.length === 3) {
                            yearsSet.add(parts[2]);
                        }
                    }
                }
            });

            let years = Array.from(yearsSet);
            years.sort((a, b) => a - b); // Ascending order

            yearSelect.innerHTML = '<option value="ALL">All Years</option>';
            years.forEach(y => {
                const opt = document.createElement('option');
                opt.value = y;
                opt.textContent = y;
                yearSelect.appendChild(opt);
            });

            if (currentSelectedYear && (currentSelectedYear === 'ALL' || years.includes(currentSelectedYear))) {
                yearSelect.value = currentSelectedYear;
            } else {
                yearSelect.value = 'ALL';
            }
        }

        function calculateGlobalBalances() {
            // Data ko chronological order mein sort karna taake balance shuru se akhir tak theek bane
            applicationData.sort((a, b) => {
                let timeA = convertToTimestamp(a.dateTime);
                let timeB = convertToTimestamp(b.dateTime);
                return timeA - timeB;
            });

            let runningBalance = 0;
            applicationData.forEach((item, index) => {
                let received = parseFloat(item.received) || 0;
                let used = parseFloat(item.used) || 0;

                if (index === 0) {
                    runningBalance = received - used;
                } else {
                    runningBalance = runningBalance + received - used;
                }
                item.balance = String(runningBalance);
            });
        }

        function convertToTimestamp(dateTimeStr) {
            if (!dateTimeStr) return 0;
            let parts = dateTimeStr.split(' ');
            let dmy = parts[0]; 
            let timePart = parts[1] || '00:00:00';
            if (dmy && dmy.includes('-')) {
                let p = dmy.split('-');
                if (p.length === 3) {
                    return new Date(`${p[2]}-${p[1]}-${p[0]}T${timePart}`).getTime();
                }
            }
            return 0;
        }

        async function fetchDataFromFirebase() {
            try {
                const querySnapshot = await window.getDocs(window.collection(window.db, "savingsData"));
                applicationData = [];
                querySnapshot.forEach((docSnap) => {
                    applicationData.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });
                calculateGlobalBalances();
                populateYearFilterOptions();
                loadTableData();
            } catch (error) {
                console.error("Error fetching data from Firebase: ", error);
            }
        }

        async function addNewRowToFirebase() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            const defaultDateTime = `${day}-${month}-${year} ${hours}:${minutes}:00`;

            const newEntry = {
                dateTime: defaultDateTime,
                amountType: "",
                detailText: "",
                received: "",
                used: "",
                balance: "0",
                remarks: ""
            };

            try {
                const docRef = await window.addDoc(window.collection(window.db, "savingsData"), newEntry);
                newEntry.id = docRef.id;
                applicationData.push(newEntry);
                calculateGlobalBalances();
                populateYearFilterOptions();
                loadTableData();
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        }

        function createRowElement(item) {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            row.setAttribute('data-id', item.id);

            let dateTimeVal = "";
            if (item.dateTime) {
                let dtParts = item.dateTime.split(' ');
                let dmy = dtParts[0]; 
                let timePart = dtParts[1] || "00:00";
                
                if (dmy && dmy.includes('-')) {
                    let p = dmy.split('-');
                    if (p.length === 3) {
                        dateTimeVal = `${p[2]}-${p[1]}-${p[0]}T${timePart.substring(0,5)}`;
                    }
                }
            }

            const amountType = item.amountType || '';
            const detailText = item.detailText || '';
            const received = item.received || '';
            const used = item.used || '';
            const balance = item.balance || '0';
            const remarks = item.remarks || '';
            
            const receivedLocked = received !== '' ? 'readonly bg-gray-100' : '';
            const usedLocked = used !== '' ? 'readonly bg-gray-100' : '';

            row.innerHTML = `
                <td>
                    <input type="datetime-local" value="${dateTimeVal}" class="border border-blue-900 p-1 text-xs w-full datetime-input rounded" onchange="updateRowData(this)">
                </td>
                <td>
                    <select class="border border-blue-900 p-1 text-xs w-full amount-type-select rounded" onchange="handleTypeChange(this)">
                        <option value="" ${amountType === '' ? 'selected' : ''} disabled>-- Select Type --</option>
                        <option value="Salary" ${amountType === 'Salary' ? 'selected' : ''}>Salary</option>
                        <option value="Pension" ${amountType === 'Pension' ? 'selected' : ''}>Pension</option>
                        <option value="Other" ${amountType === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                    <div class="detail-container mt-1 ${amountType === 'Other' ? '' : 'hidden'}">
                        <input type="text" placeholder="Enter Detail" value="${detailText}" class="border border-blue-900 p-1 text-xs w-full detail-input rounded" oninput="updateRowData(this)">
                    </div>
                </td>
                <td><input type="number" value="${received}" ${receivedLocked} class="border border-blue-900 p-1 text-xs w-full received-input rounded" placeholder="0" onblur="lockInput(this);" oninput="handleInputChange();"></td>
                <td><input type="number" value="${used}" ${usedLocked} class="border border-blue-900 p-1 text-xs w-full used-input rounded" placeholder="0" onblur="lockInput(this);" oninput="handleInputChange();"></td>
                <td><span class="balance-display font-semibold text-xs">${balance}</span></td>
                <td><input type="text" value="${remarks}" class="border border-blue-900 p-1 text-xs w-full remarks-input rounded" placeholder="Reason/Where spent" oninput="updateRowData(this)"></td>
                <td class="text-center"><button onclick="deleteRowFromFirebase(this)" class="text-red-600 font-bold text-xs hover:underline">Delete</button></td>
            `;

            tbody.appendChild(row);
        }

        function handleTypeChange(selectElement) {
            const parentTd = selectElement.parentElement;
            const detailContainer = parentTd.querySelector('.detail-container');
            if (selectElement.value === 'Other') {
                detailContainer.classList.remove('hidden');
            } else {
                detailContainer.classList.add('hidden');
                const detailInput = detailContainer.querySelector('.detail-input');
                if(detailInput) detailInput.value = '';
            }
            updateRowData(selectElement);
        }

        function lockInput(input) {
            if (input.value.trim() !== '') {
                input.setAttribute('readonly', true);
                input.classList.add('bg-gray-100');
            }
            updateRowData(input);
        }

        function handleInputChange() {
            // Live update balances across all data and refresh UI views & Firebase updates
            syncTableToApplicationData();
            calculateGlobalBalances();
            updateAllDisplayedBalances();
            saveAllDataToFirebase();
        }

        function syncTableToApplicationData() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const id = row.getAttribute('data-id');
                const item = applicationData.find(d => d.id === id);
                if (item) {
                    const receivedInput = row.querySelector('.received-input');
                    const usedInput = row.querySelector('.used-input');
                    item.received = receivedInput ? receivedInput.value : '';
                    item.used = usedInput ? usedInput.value : '';
                }
            });
        }

        function updateAllDisplayedBalances() {
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const id = row.getAttribute('data-id');
                const item = applicationData.find(d => d.id === id);
                if (item) {
                    const balanceDisplay = row.querySelector('.balance-display');
                    if (balanceDisplay) {
                        balanceDisplay.textContent = item.balance;
                    }
                }
            });
        }

        async function deleteRowFromFirebase(btn) {
            const row = btn.closest('tr');
            const id = row.getAttribute('data-id');

            try {
                if (id) {
                    await window.deleteDoc(window.doc(window.db, "savingsData", id));
                }
                applicationData = applicationData.filter(item => item.id !== id);
                calculateGlobalBalances();
                populateYearFilterOptions();
                loadTableData();
            } catch (error) {
                console.error("Error deleting document: ", error);
            }
        }

        async function updateRowData(element) {
            const row = element.closest('tr');
            const id = row.getAttribute('data-id');

            const datetimeInput = row.querySelector('.datetime-input');
            let rawVal = datetimeInput ? datetimeInput.value : '';
            let dateTime = '';

            if (rawVal) {
                let parts = rawVal.split('T');
                let datePart = parts[0]; 
                let timePart = (parts[1] || '00:00') + ':00';
                
                if (datePart && datePart.includes('-')) {
                    let dp = datePart.split('-');
                    if (dp.length === 3) {
                        dateTime = `${dp[2]}-${dp[1]}-${dp[0]} ${timePart}`;
                    }
                }
            }

            const amountTypeSelect = row.querySelector('.amount-type-select');
            const amountType = amountTypeSelect ? amountTypeSelect.value : '';
            const detailInput = row.querySelector('.detail-input');
            const detailText = detailInput ? detailInput.value : '';
            const receivedInput = row.querySelector('.received-input');
            const received = receivedInput ? receivedInput.value : '';
            const usedInput = row.querySelector('.used-input');
            const used = usedInput ? usedInput.value : '';
            const remarksInput = row.querySelector('.remarks-input');
            const remarks = remarksInput ? remarksInput.value : '';

            const index = applicationData.findIndex(item => item.id === id);
            if (index !== -1) {
                applicationData[index].dateTime = dateTime;
                applicationData[index].amountType = amountType;
                applicationData[index].detailText = detailText;
                applicationData[index].received = received;
                applicationData[index].used = used;
                applicationData[index].remarks = remarks;
            }

            calculateGlobalBalances();
            populateYearFilterOptions();
            updateAllDisplayedBalances();

            try {
                if (id) {
                    const itemToUpdate = applicationData.find(item => item.id === id);
                    if (itemToUpdate) {
                        const docRef = window.doc(window.db, "savingsData", id);
                        await window.updateDoc(docRef, itemToUpdate);
                    }
                }
            } catch (error) {
                console.error("Error updating document: ", error);
            }
        }

        async function saveAllDataToFirebase() {
            for (let item of applicationData) {
                if (item.id) {
                    try {
                        const docRef = window.doc(window.db, "savingsData", item.id);
                        await window.updateDoc(docRef, item);
                    } catch (error) {
                        console.error("Error updating document in batch: ", error);
                    }
                }
            }
        }

        function loadTableData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            const selectedMonth = document.getElementById('monthFilter').value;
            const selectedYear = document.getElementById('yearFilter').value;

            applicationData.forEach(item => {
                if (!item.dateTime) return;

                let datePart = item.dateTime.split(' ')[0]; 
                if (datePart.includes('-')) {
                    let parts = datePart.split('-');
                    if (parts.length === 3) {
                        let itemMonth = parts[1];
                        let itemYear = parts[2];

                        let matchesMonth = (selectedMonth === 'ALL' || itemMonth === selectedMonth);
                        let matchesYear = (selectedYear === 'ALL' || itemYear === selectedYear);

                        if (matchesMonth && matchesYear) {
                            createRowElement(item);
                        }
                    }
                }
            });
        }

        function filterData() {
            loadTableData();
        }
    </script>
</body>
</html>
