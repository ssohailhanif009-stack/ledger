<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Financial Management System</title>
    <!-- Tailwind CSS for clean professional styling matching index.html -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-size: 13px;
        }
        table.ms-word-table {
            border-collapse: collapse;
            width: 100%;
        }
        table.ms-word-table th, table.ms-word-table td {
            border: 1px solid #475569;
            padding: 6px 8px;
            text-align: left;
        }
        table.ms-word-table th {
            background-color: #1e293b;
            color: #f1f5f9;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Main Heading -->
        <h1 class="text-center text-xl font-extrabold uppercase tracking-wide mb-6 text-white border-b-2 border-blue-600 pb-3">
            Comprehensive Personal Financial Saving & Expense Management System
        </h1>

        <!-- Top Controls: Filter & Actions -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-slate-800 p-4 border border-slate-700 rounded-lg shadow-md">
            <div class="flex items-center gap-3">
                <label for="monthYearFilter" class="font-bold text-xs uppercase text-slate-300">Filter By Month & Year:</label>
                <select id="monthYearFilter" class="bg-slate-900 border border-slate-600 px-3 py-1 text-xs text-white rounded focus:outline-none focus:border-blue-500" onchange="filterData()">
                    <option value="all">All Records</option>
                </select>
            </div>
            <div>
                <button onclick="createNewRow()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 text-xs uppercase font-bold rounded transition-colors shadow">
                    Create New Row
                </button>
            </div>
        </div>

        <!-- Line List Table -->
        <div class="overflow-x-auto bg-slate-800 border border-slate-700 rounded-lg shadow-xl">
            <table class="ms-word-table" id="savingTable">
                <thead>
                    <tr>
                        <th>Date and Time</th>
                        <th>Amount Type</th>
                        <th>Amount Received</th>
                        <th>Used</th>
                        <th>Balance</th>
                        <th>Remarks</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Populate dynamic month options and load filter on page load
        window.addEventListener('DOMContentLoaded', () => {
            populateMonthFilterOptions();
            const savedFilter = localStorage.getItem('saving_system_filter');
            const filterInput = document.getElementById('monthYearFilter');
            
            if (savedFilter) {
                filterInput.value = savedFilter;
            } else {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                filterInput.value = `${year}-${month}`;
                localStorage.setItem('saving_system_filter', filterInput.value);
            }
            loadTableData();
        });

        function populateMonthFilterOptions() {
            const filterSelect = document.getElementById('monthYearFilter');
            // Keep 'all' option, generate last few years / months or let user type via standard input if preferred. Let's make it a month input + All option container or flexible dropdown.
        }

        // Save filter change to localStorage
        document.getElementById('monthYearFilter').addEventListener('change', function() {
            localStorage.setItem('saving_system_filter', this.value);
            loadTableData();
        });

        function getStorageKey() {
            const filterVal = document.getElementById('monthYearFilter').value || 'all';
            return `saving_system_rows_${filterVal}`;
        }

        function createNewRow(savedData = null) {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');
            row.className = "bg-slate-800 hover:bg-slate-700/50 transition-colors";

            let dateTimeStr = "";
            if (savedData && savedData.dateTime) {
                dateTimeStr = savedData.dateTime;
            } else {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                dateTimeStr = `${year}-${month}-${day}T${hours}:${minutes}`;
            }

            const amountType = savedData ? savedData.amountType : '';
            const detailText = savedData ? savedData.detailText : '';
            const received = savedData ? savedData.received : '';
            const used = savedData ? savedData.used : '';
            const balance = savedData ? savedData.balance : '';
            const remarks = savedData ? savedData.remarks : '';

            row.innerHTML = `
                <td>
                    <input type="datetime-local" value="${dateTimeStr}" class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full date-input" onchange="saveDataToStorage()">
                </td>
                <td>
                    <select class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full amount-type-select" onchange="handleTypeChange(this)">
                        <option value="" disabled ${amountType === '' ? 'selected' : ''}>-- Select Type --</option>
                        <option value="Salary" ${amountType === 'Salary' ? 'selected' : ''}>Salary</option>
                        <option value="Pension" ${amountType === 'Pension' ? 'selected' : ''}>Pension</option>
                        <option value="Other" ${amountType === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                    <div class="detail-container mt-1 ${amountType === 'Other' ? '' : 'hidden'}">
                        <input type="text" placeholder="Enter Detail" value="${detailText}" class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full detail-input" oninput="saveDataToStorage()">
                    </div>
                </td>
                <td><input type="number" value="${received}" class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full received-input" placeholder="0" oninput="calculateBalances(); saveDataToStorage();" onblur="lockInput(this)" ondblclick="unlockInput(this)"></td>
                <td><input type="number" value="${used}" class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full used-input" placeholder="0" oninput="calculateBalances(); saveDataToStorage();" onblur="lockInput(this)" ondblclick="unlockInput(this)"></td>
                <td><span class="balance-display font-semibold text-xs text-emerald-400">${balance !== '' ? balance : '0'}</span></td>
                <td><input type="text" value="${remarks}" class="bg-slate-900 border border-slate-600 p-1 text-xs text-white rounded w-full remarks-input" placeholder="Reason/Where spent" oninput="saveDataToStorage()"></td>
                <td class="text-center"><button onclick="deleteRow(this)" class="text-red-400 font-bold text-xs hover:text-red-300 underline">Delete</button></td>
            `;

            tbody.appendChild(row);
            calculateBalances();
            saveDataToStorage();
        }

        function handleTypeChange(selectElement) {
            const parentTd = selectElement.parentElement;
            const detailContainer = parentTd.querySelector('.detail-container');
            if (selectElement.value === 'Other') {
                detailContainer.classList.remove('hidden');
            } else {
                detailContainer.classList.add('hidden');
                detailContainer.querySelector('.detail-input').value = '';
            }
            saveDataToStorage();
        }

        function lockInput(input) {
            if (input.value !== "") {
                input.setAttribute('readonly', true);
                input.classList.add('bg-slate-700', 'cursor-not-allowed', 'opacity-80');
            }
        }

        function unlockInput(input) {
            input.removeAttribute('readonly');
            input.classList.remove('bg-slate-700', 'cursor-not-allowed', 'opacity-80');
            input.focus();
        }

        function deleteRow(btn) {
            const row = btn.closest('tr');
            row.remove();
            calculateBalances();
            saveDataToStorage();
        }

        function calculateBalances() {
            const rows = document.querySelectorAll('#tableBody tr');
            let runningBalance = 0;

            rows.forEach((row, index) => {
                const receivedInput = row.querySelector('.received-input');
                const usedInput = row.querySelector('.used-input');
                const balanceDisplay = row.querySelector('.balance-display');

                let received = parseFloat(receivedInput.value) || 0;
                let used = parseFloat(usedInput.value) || 0;

                if (index === 0) {
                    runningBalance = received - used;
                } else {
                    runningBalance = runningBalance + received - used;
                }

                balanceDisplay.textContent = runningBalance;
            });
        }

        function saveDataToStorage() {
            const rows = document.querySelectorAll('#tableBody tr');
            const dataToSave = [];

            rows.forEach(row => {
                const dateTime = row.querySelector('.date-input').value;
                const amountType = row.querySelector('.amount-type-select').value;
                const detailText = row.querySelector('.detail-input') ? row.querySelector('.detail-input').value : '';
                const received = row.querySelector('.received-input').value;
                const used = row.querySelector('.used-input').value;
                const balance = row.querySelector('.balance-display').innerText;
                const remarks = row.querySelector('.remarks-input').value;

                dataToSave.push({
                    dateTime,
                    amountType,
                    detailText,
                    received,
                    used,
                    balance,
                    remarks
                });
            });

            localStorage.setItem(getStorageKey(), JSON.stringify(dataToSave));
        }

        function loadTableData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            const savedData = JSON.parse(localStorage.getItem(getStorageKey()));
            if (savedData && savedData.length > 0) {
                savedData.forEach(item => {
                    createNewRow(item);
                });
            }
            calculateBalances();
        }

        function filterData() {
            loadTableData();
        }
    </script>
</body>
</html>
