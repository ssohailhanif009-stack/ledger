<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Financial Management System</title>
    <!-- Tailwind CSS for clean layout, customized for small professional fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-size: 13px;
        }
        /* Official Navy Blue / MS Word style simple table */
        table.ms-word-table {
            border-collapse: collapse;
            width: 100%;
        }
        table.ms-word-table th, table.ms-word-table td {
            border: 1px solid #1e3a8a;
            padding: 6px 8px;
            text-align: left;
            white-space: nowrap; /* Mobile par data ke mutabiq column expand hone ke liye */
        }
        table.ms-word-table th {
            background-color: #1e3a8a;
            color: white;
            text-transform: uppercase;
            font-size: 12px;
        }
    </style>
</head>
<body class="bg-white text-gray-900 p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Main Heading with Navy Blue Shade -->
        <h1 class="text-center text-xl font-bold uppercase tracking-wide mb-6 bg-blue-900 text-white py-3 px-4 rounded shadow">
            Comprehensive Personal Financial Saving & Expense Management System
        </h1>

        <!-- Top Controls: Filter & Actions -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4 bg-blue-50 p-3 border border-blue-900 rounded">
            <div class="flex items-center gap-2">
                <label for="monthYearFilter" class="font-bold text-xs uppercase text-blue-900">Filter By Month & Year:</label>
                <select id="monthYearFilter" class="border border-blue-900 px-2 py-1 text-xs bg-white rounded" onchange="filterData()">
                    <option value="ALL">All Months</option>
                </select>
            </div>
            <div>
                <button onclick="createNewRow()" class="bg-blue-900 text-white px-4 py-1 text-xs uppercase font-semibold rounded hover:bg-blue-800">
                    Create New Row
                </button>
            </div>
        </div>

        <!-- Line List Table -->
        <div class="overflow-x-auto shadow-sm rounded border border-blue-900">
            <table class="ms-word-table" id="savingTable">
                <thead>
                    <tr>
                        <th>Date and Time</th>
                        <th>Amount Type</th>
                        <th>Amount Received</th>
                        <th>Used</th>
                        <th>Balance</th>
                        <th>Remarks</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dynamic rows will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBNDifUQOSYt_nQSeL_ZIxXhfNzTGQJGdA",
            authDomain: "ledger-df7a0.firebaseapp.com",
            projectId: "ledger-df7a0",
            storageBucket: "ledger-df7a0.firebasestorage.app",
            messagingSenderId: "854106995075",
            appId: "1:854106995075:web:198b3702c4214197929eb6",
            measurementId: "G-9C0C5XSD5K"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        window.firebaseApp = app;
    </script>

    <script>
        let applicationData = [];

        window.addEventListener('DOMContentLoaded', () => {
            populateMonthFilterOptions();
            loadTableData();
        });

        function populateMonthFilterOptions() {
            const filterSelect = document.getElementById('monthYearFilter');
            const currentSelected = filterSelect.value;
            
            filterSelect.innerHTML = '<option value="ALL">All Months</option>';
            
            let uniqueMonths = new Set();
            applicationData.forEach(item => {
                if (item.dateTime) {
                    let parts = item.dateTime.split(' ')[0];
                    if (parts.includes('-')) {
                        let subParts = parts.split('-');
                        if (subParts.length === 3) {
                            // Format: DD-MM-YYYY -> YYYY-MM for sorting and grouping
                            uniqueMonths.add(`${subParts[2]}-${subParts[1]}`);
                        }
                    }
                }
            });

            // Pure life tak ke liye pichle 10 saal se lekar agle 10 saal tak ke options generate karna
            const now = new Date();
            const currentYear = now.getFullYear();
            for (let y = currentYear - 10; y <= currentYear + 10; y++) {
                for (let m = 1; m <= 12; m++) {
                    let monthStr = String(m).padStart(2, '0');
                    uniqueMonths.add(`${y}-${monthStr}`);
                }
            }

            const sortedMonths = Array.from(uniqueMonths).sort().reverse();
            sortedMonths.forEach(m => {
                let parts = m.split('-');
                let displayLabel = `${parts[1]}-${parts[0]}`; // MM-YYYY format for dropdown view
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = displayLabel;
                filterSelect.appendChild(opt);
            });

            if (currentSelected) {
                filterSelect.value = currentSelected;
            }
        }

        function createNewRow(savedData = null) {
            const tbody = document.getElementById('tableBody');
            const row = document.createElement('tr');

            let dateVal = "";
            let timeVal = "";
            
            if (savedData && savedData.dateTime) {
                let dtParts = savedData.dateTime.split(' ');
                let dmy = dtParts[0]; // DD-MM-YYYY
                if (dmy && dmy.includes('-')) {
                    let p = dmy.split('-');
                    if (p.length === 3) {
                        dateVal = `${p[2]}-${p[1]}-${p[0]}`; // YYYY-MM-DD for input element
                    }
                }
                timeVal = dtParts[1] || "";
            }
            
            if (!dateVal) {
                const now = new Date();
                const day = String(now.getDate()).padStart(2, '0');
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const year = now.getFullYear();
                dateVal = `${year}-${month}-${day}`;
                timeVal = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            }

            const amountType = savedData ? savedData.amountType : '';
            const detailText = savedData ? savedData.detailText : '';
            const received = savedData ? savedData.received : '';
            const used = savedData ? savedData.used : '';
            const balance = savedData ? savedData.balance : '';
            const remarks = savedData ? savedData.remarks : '';
            
            const receivedLocked = received !== '' ? 'readonly bg-gray-100' : '';
            const usedLocked = used !== '' ? 'readonly bg-gray-100' : '';

            row.innerHTML = `
                <td>
                    <div class="flex items-center gap-1">
                        <input type="date" value="${dateVal}" class="border border-blue-900 p-1 text-xs date-input rounded" onchange="saveDataToMemory()">
                        <input type="time" step="1" value="${timeVal}" class="border border-blue-900 p-1 text-xs time-input rounded" onchange="saveDataToMemory()">
                    </div>
                </td>
                <td>
                    <select class="border border-blue-900 p-1 text-xs w-full amount-type-select rounded" onchange="handleTypeChange(this)">
                        <option value="" ${amountType === '' ? 'selected' : ''} disabled>-- Select Type --</option>
                        <option value="Salary" ${amountType === 'Salary' ? 'selected' : ''}>Salary</option>
                        <option value="Pension" ${amountType === 'Pension' ? 'selected' : ''}>Pension</option>
                        <option value="Other" ${amountType === 'Other' ? 'selected' : ''}>Other</option>
                    </select>
                    <div class="detail-container mt-1 ${amountType === 'Other' ? '' : 'hidden'}">
                        <input type="text" placeholder="Enter Detail" value="${detailText}" class="border border-blue-900 p-1 text-xs w-full detail-input rounded" oninput="saveDataToMemory()">
                    </div>
                </td>
                <td><input type="number" value="${received}" ${receivedLocked} class="border border-blue-900 p-1 text-xs w-full received-input rounded" placeholder="0" onblur="lockInput(this)" oninput="calculateBalances(); saveDataToMemory();"></td>
                <td><input type="number" value="${used}" ${usedLocked} class="border border-blue-900 p-1 text-xs w-full used-input rounded" placeholder="0" onblur="lockInput(this)" oninput="calculateBalances(); saveDataToMemory();"></td>
                <td><span class="balance-display font-semibold text-xs">${balance !== '' ? balance : '0'}</span></td>
                <td><input type="text" value="${remarks}" class="border border-blue-900 p-1 text-xs w-full remarks-input rounded" placeholder="Reason/Where spent" oninput="saveDataToMemory()"></td>
                <td class="text-center"><button onclick="deleteRow(this)" class="text-red-600 font-bold text-xs hover:underline">Delete</button></td>
            `;

            tbody.appendChild(row);
            calculateBalances();
            saveDataToMemory();
        }

        function handleTypeChange(selectElement) {
            const parentTd = selectElement.parentElement;
            const detailContainer = parentTd.querySelector('.detail-container');
            if (selectElement.value === 'Other') {
                detailContainer.classList.remove('hidden');
            } else {
                detailContainer.classList.add('hidden');
                const detailInput = detailContainer.querySelector('.detail-input');
                if(detailInput) detailInput.value = '';
            }
            saveDataToMemory();
        }

        function lockInput(input) {
            if (input.value.trim() !== '') {
                input.setAttribute('readonly', true);
                input.classList.add('bg-gray-100');
            }
        }

        function deleteRow(btn) {
            const row = btn.closest('tr');
            row.remove();
            calculateBalances();
            saveDataToMemory();
        }

        function calculateBalances() {
            const rows = document.querySelectorAll('#tableBody tr');
            let runningBalance = 0;

            rows.forEach((row, index) => {
                const receivedInput = row.querySelector('.received-input');
                const usedInput = row.querySelector('.used-input');
                const balanceDisplay = row.querySelector('.balance-display');

                let received = parseFloat(receivedInput.value) || 0;
                let used = parseFloat(usedInput.value) || 0;

                if (index === 0) {
                    runningBalance = received - used;
                } else {
                    runningBalance = runningBalance + received - used;
                }

                balanceDisplay.textContent = runningBalance;
            });
        }

        function saveDataToMemory() {
            const rows = document.querySelectorAll('#tableBody tr');
            applicationData = [];

            rows.forEach(row => {
                const dateInput = row.querySelector('.date-input');
                const timeInput = row.querySelector('.time-input');
                let rawDate = dateInput ? dateInput.value : '';
                let rawTime = timeInput ? timeInput.value : '00:00:00';
                
                // Format display as DD/MM/YYYY
                let formattedDate = rawDate;
                if (rawDate && rawDate.includes('-')) {
                    let parts = rawDate.split('-');
                    if (parts.length === 3) {
                        formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
                    }
                }
                const dateTime = `${formattedDate} ${rawTime}`;

                const amountTypeSelect = row.querySelector('.amount-type-select');
                const amountType = amountTypeSelect ? amountTypeSelect.value : '';
                const detailInput = row.querySelector('.detail-input');
                const detailText = detailInput ? detailInput.value : '';
                const receivedInput = row.querySelector('.received-input');
                const received = receivedInput ? receivedInput.value : '';
                const usedInput = row.querySelector('.used-input');
                const used = usedInput ? usedInput.value : '';
                const balanceDisplay = row.querySelector('.balance-display');
                const balance = balanceDisplay ? balanceDisplay.innerText : '';
                const remarksInput = row.querySelector('.remarks-input');
                const remarks = remarksInput ? remarksInput.value : '';

                applicationData.push({
                    dateTime,
                    amountType,
                    detailText,
                    received,
                    used,
                    balance,
                    remarks
                });
            });

            populateMonthYearFilterDropdownOnly();
        }

        function populateMonthYearFilterDropdownOnly() {
            // Dropdown selection state ko maintain rakhte hue options refresh karna
            const filterSelect = document.getElementById('monthYearFilter');
            const currentSelected = filterSelect.value;
            
            let uniqueMonths = new Set();
            applicationData.forEach(item => {
                if (item.dateTime) {
                    let parts = item.dateTime.split(' ')[0];
                    if (parts.includes('/')) {
                        let subParts = parts.split('/');
                        if (subParts.length === 3) {
                            uniqueMonths.add(`${subParts[2]}-${subParts[1]}`);
                        }
                    }
                }
            });

            const now = new Date();
            const currentYear = now.getFullYear();
            for (let y = currentYear - 10; y <= currentYear + 10; y++) {
                for (let m = 1; m <= 12; m++) {
                    let monthStr = String(m).padStart(2, '0');
                    uniqueMonths.add(`${y}-${monthStr}`);
                }
            }

            filterSelect.innerHTML = '<option value="ALL">All Months</option>';
            const sortedMonths = Array.from(uniqueMonths).sort().reverse();
            sortedMonths.forEach(m => {
                let parts = m.split('-');
                let displayLabel = `${parts[1]}-${parts[0]}`;
                const opt = document.createElement('option');
                opt.value = m;
                opt.textContent = displayLabel;
                filterSelect.appendChild(opt);
            });

            if (currentSelected) {
                filterSelect.value = currentSelected;
            }
        }

        function loadTableData() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; 

            const filterVal = document.getElementById('monthYearFilter').value;

            applicationData.forEach(item => {
                if (filterVal === 'ALL') {
                    createNewRow(item);
                } else {
                    if (item.dateTime) {
                        let datePart = item.dateTime.split(' ')[0]; // DD/MM/YYYY
                        if (datePart.includes('/')) {
                            let parts = datePart.split('/');
                            if (parts.length === 3) {
                                let itemMonthYear = `${parts[2]}-${parts[1]}`; // YYYY-MM
                                if (itemMonthYear === filterVal) {
                                    createNewRow(item);
                                }
                            }
                        }
                    }
                }
            });
            calculateBalances();
        }

        function filterData() {
            loadTableData();
        }
    </script>
</body>
</html>
